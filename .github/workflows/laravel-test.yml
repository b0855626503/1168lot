name: Laravel Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      LADA_CACHE_ACTIVE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, ctype, fileinfo, json, pdo_sqlite, redis
          coverage: none
          tools: composer

      - name: Install MongoDB extension 1.21.0
        run: |
          sudo pecl uninstall mongodb || true
          printf "\n" | sudo pecl install mongodb-1.21.0
          echo "extension=mongodb.so" | sudo tee /etc/php/8.2/cli/conf.d/99-mongodb.ini
          php -m | grep mongodb
          php --ri mongodb

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          APP_NAME=CI
          APP_ENV=testing
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=true
          APP_URL=http://localhost

          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync

          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:

          LADA_CACHE_ACTIVE=false
          EOF

      - name: Validate Composer platform
        run: composer check-platform-reqs

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Laravel package discover
        run: php artisan package:discover --ansi

      - name: Run tests
        run: php artisan test
