<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00008B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="512" height="300" fill="url(#sky)"/>
  
  <!-- Water -->
  <rect y="300" width="512" height="212" fill="url(#water)"/>
  
  <!-- Waterfall -->
  <rect x="150" y="250" width="212" height="150" fill="#B0E0E6" opacity="0.7"/>
  <ellipse cx="256" cy="350" rx="100" ry="30" fill="#87CEEB" opacity="0.9"/>
  
  <!-- Bot body -->
  <circle cx="256" cy="200" r="80" fill="#4A90E2"/>
  <circle cx="256" cy="200" r="60" fill="#5DADE2"/>
  
  <!-- Eyes -->
  <circle cx="230" cy="180" r="12" fill="white"/>
  <circle cx="282" cy="180" r="12" fill="white"/>
  <circle cx="232" cy="182" r="5" fill="black"/>
  <circle cx="284" cy="182" r="5" fill="black"/>
  
  <!-- Smile -->
  <path d="M 220,220 Q 256,250 292,220" stroke="black" stroke-width="4" fill="none"/>
  
  <!-- Water splashes -->
  <circle cx="200" cy="280" r="15" fill="white" opacity="0.7"/>
  <circle cx="312" cy="280" r="15" fill="white" opacity="0.7"/>
  <circle cx="256" cy="320" r="20" fill="white" opacity="0.6"/>
  
  <!-- Text -->
  <text x="256" y="450" text-anchor="middle" fill="white" font-family="Arial" font-size="24">
    jr 🤖
  </text>
</svg>
